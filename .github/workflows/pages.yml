name: Deploy public demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/configure-pages@v5
      - run: npm ci
      - name: Build static demo
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_DEMO_MODE: "true"
          NEXT_PUBLIC_BASE_PATH: /equiply
          NEXT_PUBLIC_SITE_URL: https://piierolu.github.io/equiply
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
